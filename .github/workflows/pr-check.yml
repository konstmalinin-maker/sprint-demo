name: PR checks

on:
  pull_request:
    branches: [sprint-1, main]
  push:
    branches: [sprint-1, main]

permissions:
  contents: read

jobs:
  quality:
    name: lint-and-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run tests with coverage
        id: tests
        if: ${{ !cancelled() && success() }}
        run: >
          python -m pytest -v
          --cov=src
          --cov-report=term-missing
          --cov-report=json:coverage.json

      - name: Comment coverage on PR
        if: >-
          ${{ !cancelled() &&
              github.event_name == 'pull_request' &&
              steps.tests.outcome != 'skipped' &&
              hashFiles('coverage.json') != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('coverage.json', 'utf8')
            );
            const total = report.totals;
            const percent = total.percent_covered.toFixed(2);
            const body = [
              '## Отчёт о покрытии тестами',
              '',
              `Покрытие: **${percent}%**`,
              `Покрыто строк: ${total.covered_lines} из ${total.num_statements}.`,
              `Не покрыто строк: ${total.missing_lines}.`,
              '',
              `[Запуск CI](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });